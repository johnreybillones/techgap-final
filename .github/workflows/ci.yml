name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate:
    name: Lint, Dependencies & Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install build tooling & linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Install dependencies & check compatibility
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f scripts/requirements-collection.txt ]; then pip install -r scripts/requirements-collection.txt; fi
          pip check

      - name: Lint and syntax validation (Ruff)
        run: |
          ruff check .

      - name: Smoke test script entry points
        run: |
          python scripts/extract_syllabi.py --help

      - name: Run unit tests with pytest
        run: |
          pytest -v
